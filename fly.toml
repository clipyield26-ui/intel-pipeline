app = "intel-pipeline"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# Multi-region: iad (Virginia), ams (Amsterdam), sin (Singapore)
[[services]]
  protocol = "tcp"
  internal_port = 8000

[env]
  API_TOKEN = "change-me-in-production"
